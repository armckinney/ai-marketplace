<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ck-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="ck-arrow" x1="12" y1="35" x2="39" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ck-pillar" x1="40" y1="26" x2="40" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#ck-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#334155" stroke-width="1.5" stroke-opacity="0.65"/>

  <!-- Ascending career pillars -->
  <rect x="13" y="43" width="8" height="9" rx="2.5" fill="#334155"/>
  <rect x="24.5" y="35" width="8" height="17" rx="2.5" fill="#475569"/>
  <rect x="36" y="26" width="8" height="26" rx="2.5" fill="url(#ck-pillar)"/>

  <!-- Sweeping trajectory arrow -->
  <path d="M12 35 Q25 29 38 16" stroke="url(#ck-arrow)" stroke-width="3.75" stroke-linecap="round"/>
  <path d="M31.5 16 L38 16 L38 22.5" stroke="#818CF8" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Distilled achievement North-star sparkle -->
  <path d="M48 11 L49.5 14 L52.5 15.5 L49.5 17 L48 20 L46.5 17 L43.5 15.5 L46.5 14 Z" fill="#F8FAFC"/>
</svg>
